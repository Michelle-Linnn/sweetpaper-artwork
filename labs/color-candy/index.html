<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Candy · sweetpaper lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/lab.css">
</head>
<body>
  <header class="lab-bar">
    <a href="../../index.html#labs">← Back to Labs</a>
    <span class="title">004 Color Candy</span>
    <a href="https://wenjielin.com" target="_blank" rel="noopener">wenjielin.com ↗</a>
  </header>
  <main class="stage">
    <canvas id="c"></canvas>
    <p class="hint">Click for a new palette · Click a hex code to copy it</p>
  </main>
  <script>
  // Resize the canvas to fit (retina-aware)
  var c = document.getElementById("c"), ctx = c.getContext("2d"), W, H;
  function fit() {
    var r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    W = r.width; H = r.height; c.width = W * d; c.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    if (window.onFit) onFit();
  }
  window.addEventListener("resize", fit);
  </script>
  <script>
  // Five random "candy" colors: high lightness, soft saturation, hues spread around a base hue
  var swatches = [], copied = -1;

  function hsl2hex(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return "#" + [f(0), f(8), f(4)].map(function (x) { return Math.round(x * 255).toString(16).padStart(2, "0"); }).join("");
  }
  function generate() {
    var base = Math.random() * 360;
    swatches = [];
    for (var i = 0; i < 5; i++) {
      var h = (base + i * (40 + Math.random() * 40)) % 360;
      swatches.push(hsl2hex(h, 55 + Math.random() * 30, 78 + Math.random() * 10));
    }
    copied = -1;
    draw();
  }
  function draw() {
    var w = W / swatches.length;
    swatches.forEach(function (col, i) {
      ctx.fillStyle = col; ctx.fillRect(i * w, 0, w + 1, H);
      ctx.fillStyle = "#2b2522"; ctx.font = "500 15px Inter, sans-serif"; ctx.textAlign = "center";
      ctx.fillText(i === copied ? "Copied ✓" : col.toUpperCase(), i * w + w / 2, H / 2);
    });
  }
  window.onFit = function () { if (swatches.length) draw(); };

  c.addEventListener("click", function (e) {
    var r = c.getBoundingClientRect(), y = e.clientY - r.top;
    // The middle band holds the hex codes: click there to copy, anywhere else for a new palette
    if (Math.abs(y - H / 2) < 30) {
      var i = Math.floor((e.clientX - r.left) / (W / swatches.length));
      if (navigator.clipboard) navigator.clipboard.writeText(swatches[i]).catch(function () {});
      copied = i; draw();
    } else {
      generate();
    }
  });
  fit();
  generate();
  </script>
</body>
</html>
